      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>Introduction</h2><p>A man and his son travel south through an ash-covered landscape with essential supplies in their cart.</p></details><details><summary>The Road · 1</summary><h2>The southward road</h2><p>A man and his boy travel south through an ash-covered landscape, carrying essentials in knapsacks alongside their cart.</p></details><details><summary>The Road · 1</summary><h2>The southward road</h2><p>The man salvages lamp oil, repairs the cart and finds blankets and food. The boy asks for light at bedtime and insists on sharing a rare soft drink.</p></details><details><summary>The Road · 1</summary><h2>The southward road</h2><p>Memories of childhood contrast with their present journey. A visit to the man’s childhood house frightens the boy; afterward, the man identifies a ground tremor as an earthquake.</p></details><details><summary>The Road · 1</summary><h2>The southward road</h2><p>:

: </p></details><details><summary>The Road · 2</summary><h2>A mountain pass and a blocked bridge</h2><p>The man and the boy cross a snowy mountain gap as his cough produces blood. The boy challenges him to honour his promise to share their remaining cocoa.</p></details><details><summary>The Road · 2</summary><h2>A mountain pass and a blocked bridge</h2><p>At a waterfall, they swim, gather mushrooms the man identifies as morels, and enjoy a meal and stories. Despite the respite, the man insists they leave because the falls could attract strangers and conceal their approach.</p></details><details><summary>The Road · 2</summary><h2>A mountain pass and a blocked bridge</h2><p>A truck blocks a bridge. They sleep in its cab and pass their supplies underneath; the man climbs onto the trailer and discovers bodies inside.</p></details><details><summary>The Road · 2</summary><h2>A mountain pass and a blocked bridge</h2><p>:

: </p></details><details><summary>The Road · 3</summary><h2>The mother leaves</h2><p>After fire delays their progress, the man and the boy pass a burned traveller. The father says they cannot help; the boy weeps.</p></details><details><summary>The Road · 3</summary><h2>The mother leaves</h2><p>Recollections reveal the disaster’s first light and concussions, the boy’s birth, and his mother’s departure with the intention of ending her life. The man discards a photograph of his wife and later regrets his failure to preserve her place in their lives.</p></details><details><summary>The Road · 3</summary><h2>The mother leaves</h2><p>They hide from an armed group, but one of its members finds them and seizes the boy. The father shoots him and escapes carrying the child. With one round remaining, he struggles to get the boy to speak before they reach the road again.</p></details><details><summary>The Road · 3</summary><h2>The mother leaves</h2><p>:

: </p></details><details><summary>The Road · 4</summary><h2>The other child and the stolen cart</h2><p>The man retrieves the plundered cart and cleans the boy after their escape. When the boy asks whether they remain good, his father assures him they do and later gives him a handmade cane flute.</p></details><details><summary>The Road · 4</summary><h2>The other child and the stolen cart</h2><p>Smoke draws them toward a town, where they salvage cornmeal and hear a dog. The boy sees another child and wants to share his food; his father denies the child’s presence and insists they leave. Their talk introduces carrying the fire.</p></details><details><summary>The Road · 4</summary><h2>The other child and the stolen cart</h2><p>After their food runs out again, they find grain in a barn. The man sees human heads displayed on a wall, and the two hide as a red-scarved procession passes with enslaved people and sexual captives.</p></details><details><summary>The Road · 4</summary><h2>The other child and the stolen cart</h2><p>:

: </p></details><details><summary>The Road · 5</summary><h2>Flight from the cellar</h2><p>Heavy snow drives the man and the boy into cedar woods, but falling trees force them to shelter under a fallen trunk. The man improvises foot wraps and abandons the cart. They hide from two men after discovering tracks near their fire.</p></details><details><summary>The Road · 5</summary><h2>Flight from the cellar</h2><p>Five days without food bring them to a large house, despite the boy’s objections. The man opens a locked floor hatch and discovers captives pleading for help, including a severely mutilated man.</p></details><details><summary>The Road · 5</summary><h2>Flight from the cellar</h2><p>They flee as six people approach the house and hide in the woods. The father takes back the gun he has handed the boy and promises to stay with him. After hearing screams from the house, they escape through the woods at night.</p></details><details><summary>The Road · 5</summary><h2>Flight from the cellar</h2><p>:

: </p></details><details><summary>The Road · 8</summary><h2>The old traveller</h2><p>The man and the boy leave the bunker with supplies in their replacement cart. The boy clears the road with a broom and says he has discarded his flute. His father estimates the coast is two hundred miles away in a straight line.</p></details><details><summary>The Road · 8</summary><h2>The old traveller</h2><p>They meet an old traveller, who offers the name Ely but later admits it is false. At the boy’s urging, they share fruit and a night’s camp with him. His account of receiving food from others is retracted; they give him a few cans before parting.</p></details><details><summary>The Road · 8</summary><h2>The old traveller</h2><p>The father’s cough worsens and he speaks of his death. Their stove fuel runs out, for which he accepts responsibility. On the coastal plain the boy discovers a train, but its search yields only paper plates.</p></details><details><summary>The Road · 8</summary><h2>The old traveller</h2><p>:

: </p></details><details><summary>The Road · 8</summary><h2>The old traveller</h2><p>: </p></details><details><summary>The Road · 9</summary><h2>Smoke on the road</h2><p>They leave the abandoned train and encounter roadside cairns that the narration interprets as messages to the lost and dead. A map check corrects the father’s estimate of their position. At a drugstore they see a dried human head beneath a cake cover.</p></details><details><summary>The Road · 9</summary><h2>Smoke on the road</h2><p>Three armed men step aside as the travellers continue. The father then becomes feverish. Later they cross a fire-damaged landscape marked by dead figures trapped in the road.</p></details><details><summary>The Road · 9</summary><h2>Smoke on the road</h2><p>Suspecting a follower, the boy proposes hiding their waste and watching the road. They conceal the cart and see a small group pass. At a later campfire they discover the remains of a human infant. The boy regrets his earlier words about the burned dead and hopes they could have taken the infant.</p></details><details><summary>The Road · 9</summary><h2>Smoke on the road</h2><p>They drink from a roadside seep after filtering its water. Later, the father finds an old coin and they approach a columned house.</p></details><details><summary>The Road · 9</summary><h2>Smoke on the road</h2><p>:

: </p></details><details><summary>The Road · 10</summary><h2>The grey coast and the sailboat</h2><p>The travellers enter a large house at dusk. Inside, the boy worries about going upstairs, and the father finds jars of preserved food whose safety he cannot confirm. They cook some of it and stay in the house for four days, gathering wood and water, bathing and using salvaged clothing and bedding.</p></details><details><summary>The Road · 10</summary><h2>The grey coast and the sailboat</h2><p>The boy fears there may be someone upstairs. The father argues that years of undisturbed ash and the house’s food suggest nobody remains, while the boy recalls that wind erases tracks. They leave with a repaired wheelbarrow carrying food and blankets. The father reflects on uncertain hopes about the coast and on graves from a childhood memory.</p></details><details><summary>The Road · 10</summary><h2>The grey coast and the sailboat</h2><p>At the coast they see a bleak, lifeless sea and a tanker. The boy swims in the cold surf. Later they spot a partly submerged sailboat and the father swims out to investigate it while the boy keeps watch.</p></details><details><summary>The Road · 10</summary><h2>The grey coast and the sailboat</h2><p>The father boards the sailboat and finds it stripped, flooded and ransacked by the sea. He searches it for supplies, gathers clothing and tools, and finds a brass sextant that stirs him. As the tide rises, he notices the boat shift slightly.</p></details><details><summary>The Road · 10</summary><h2>The grey coast and the sailboat</h2><p>:

: </p></details><details><summary>The Road · 11</summary><h2>A flare and a fever</h2><p>The father removes food, water, fuel and a stove burner from the sailboat and carries them ashore. On the return to camp, he discovers the pistol was left behind. He retrieves it with the boy, and they continue along the beach as darkness and a storm overtake them.</p></details><details><summary>The Road · 11</summary><h2>A flare and a fever</h2><p>They find their tarp by listening for rain on it and shelter beneath it. After the storm, the father sees a corpse in the shallows. He and the boy spend the morning unloading the sailboat and drying supplies. The father coughs blood and reflects that he is dying.</p></details><details><summary>The Road · 11</summary><h2>A flare and a fever</h2><p>The father makes another search of the boat and discovers a hidden compartment with an inflatable raft, signalling equipment, a first-aid kit and a flare pistol. He tells the boy there is nobody to signal, but agrees to fire a flare as a celebration. They think aloud about the boat’s former occupants and whether other people remain alive.</p></details><details><summary>The Road · 11</summary><h2>A flare and a fever</h2><p>After firing the flare, the father promises to stay with the boy. The boy develops a high fever and vomits. His father nurses him through the illness, and he eventually wakes feeling better. A few days later they discover that someone has stolen their supplies and cart.</p></details><details><summary>The Road · 11</summary><h2>A flare and a fever</h2><p>:
