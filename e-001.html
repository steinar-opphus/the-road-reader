      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>Overview</h2><p>The man travels south with the boy, who calls him Papa.</p></details><details><summary>The Road · 1</summary><h2>Overview</h2><p>He tells the boy he would want to die if the boy died.</p></details><details><summary>The Road · 1</summary><h2>Memories and endurance</h2><p>He has kept no calendar for years and suffers a prolonged coughing fit.</p></details><details><summary>The Road · 1</summary><h2>Memories and endurance</h2><p>He remembers a day gathering firewood with his uncle, and recalls doing homework with his sisters. He distrusts pleasant dreams as temptations away from survival.</p></details><details><summary>The Road · 2</summary><h2>Crossing the mountain gap</h2><p>His cough now produces blood. He recognizes a gap visited with his father and says their future depends on reaching the coast, although he doubts that hope privately.</p></details><details><summary>The Road · 2</summary><h2>Crossing the mountain gap</h2><p>Near the waterfall, he identifies morels and decides they cannot safely remain beside the noisy water.</p></details><details><summary>The Road · 3</summary><h2>Refusal, remembrance and a violent escape</h2><p>He refuses help to a burned traveller, saying their supplies cannot stretch further. He discards his wife’s photograph but later regrets not keeping her in their lives.</p></details><details><summary>The Road · 3</summary><h2>Refusal, remembrance and a violent escape</h2><p>In recollection he fills a bathtub when the power fails and later assists at his son’s birth. Asked by a stranger whether he is a doctor, he refuses that identification.</p></details><details><summary>The Road · 3</summary><h2>Refusal, remembrance and a violent escape</h2><p>He shoots the stranger after the boy is seized, then escapes with one round left in his revolver.</p></details><details><summary>The Road · 4</summary><h2>Protection and the limits of help</h2><p>He washes the remains of the attacker from the boy and says God appointed him to protect his child. The encounter was his first conversation with anyone else for more than a year.</p></details><details><summary>The Road · 4</summary><h2>Protection and the limits of help</h2><p>He promises not to harm a barking dog, but denies the other child the boy sees and insists on leaving. He later recalls an earlier dog whose life the boy begged him to spare.</p></details><details><summary>The Road · 4</summary><h2>Protection and the limits of help</h2><p>He considers the passing red-scarved group’s movements a bad sign.</p></details><details><summary>The Road · 5</summary><h2>A desperate search for food</h2><p>He admits he might lie to the boy about dying, while insisting they are not dying now. He lays confusing tracks to conceal their route.</p></details><details><summary>The Road · 5</summary><h2>A desperate search for food</h2><p>After five days without food and little sleep, he forces the hatch in a large house. During their escape he takes back the gun he has handed the boy and abandons a plan to draw pursuit away, promising not to leave him.</p></details><details><summary>The Road · 6</summary><h2>Apples, remorse and another locked door</h2><p>He recognizes desperation as the cause of his earlier carelessness. Later he admits concealing the lost lighter, and sobs while watching the boy sleep.</p></details><details><summary>The Road · 6</summary><h2>Apples, remorse and another locked door</h2><p>A mirror startles him into almost treating their reflections as strangers. At another house he finds fuel and unearths a protected door.</p></details><details><summary>The Road · 7</summary><h2>Rest without lasting security</h2><p>He tells the boy the absent owners would want their supplies used. He finds gold coins but puts them back, while the visible hatch keeps him worried about discovery.</p></details><details><summary>The Road · 7</summary><h2>Rest without lasting security</h2><p>He bathes the boy, trims his own hair and beard and shaves. He doubts they will meet good people on the road and reflects that his lost world makes him seem alien to the child.</p></details><details><summary>The Road · 8</summary><h2>A visitor and the cost of watchfulness</h2><p>He estimates the coast is two hundred miles away in a straight line and allows the old traveller to share one night’s camp. After another coughing fit he says he is going to die.</p></details><details><summary>The Road · 8</summary><h2>A visitor and the cost of watchfulness</h2><p>He takes responsibility for the stove’s fuel loss and guesses that an abandoned train also stopped for lack of fuel. The train’s cause of abandonment is not established.</p></details><details><summary>The Road · 9</summary><h2>Uncertain coast and a fever</h2><p>A map places the travellers about fifty miles west of where he had thought. The father remembers childhood maps and directories; when asked whether the sea is blue, he says it used to be.</p></details><details><summary>The Road · 9</summary><h2>Uncertain coast and a fever</h2><p>He develops a fever and diarrhoea, then tells the boy he expects to recover. He tells the boy some good people are hiding from each other, and warns against retreating into pleasant unreal dreams.</p></details><details><summary>The Road · 10</summary><h2>A refuge and the grey sea</h2><p>The father guesses that the house’s occupants left its door open while removing belongings. He cautions that the canned food may be poisonous, but thinks thorough cooking could make it safe. At night he tells the boy he thinks they are being watched by those waiting for a sign that death cannot undo.</p></details><details><summary>The Road · 10</summary><h2>A refuge and the grey sea</h2><p>He reasons that the house has been empty for years. After their stay, he recognises that his hopes for the coast lack evidence. On seeing the grey sea, he apologises that it is not blue. He imagines another father and child across the sea, while acknowledging they do not know whether they are there.</p></details><details><summary>The Road · 10</summary><h2>A refuge and the grey sea</h2><p>At the sailboat, the boy sees his father in salvaged clothing and initially does not recognise him.</p></details><details><summary>The Road · 11</summary><h2>A storm, a flare and a promise</h2><p>The father forgets the pistol on the beach, accepts responsibility and retrieves it. During their storm-bound walk he reassures the boy and finds their tarp by listening for the rain on it. At night, coughing blood, he tells himself that he is dying.</p></details><details><summary>The Road · 11</summary><h2>A storm, a flare and a promise</h2><p>After finding a flare pistol, he tells the boy it is for signalling, while admitting there is nobody to signal. He agrees to fire it as a celebration and later says that other people may remain alive. When the boy falls ill, he promises not to leave him alone.</p></details><details><summary>The Road · 12</summary><h2>The last journey</h2><p>The father tells the boy that he is scared, and the boy says he too must worry about what happens. The father leaves the thief’s clothes and shoes by the road, but the boy believes they have killed him.</p></details><details><summary>The Road · 12</summary><h2>The last journey</h2><p>A bowman wounds the father in the leg. He stitches the wound himself and later removes the sutures. His cough and blood-spitting worsen as they travel.</p></details><details><summary>The Road · 12</summary><h2>The last journey</h2><p>After the boy agrees to continue without him, the father dies at their camp. The boy stays beside his body for three days.</p></details><details><summary>Illustration · The Road · 1</summary><p><a href="assets/aaf4195476f2a6.png">Open noncanonical illustration</a></p><p>Lamplight beneath the rock shelter at bedtime.</p></details><details><summary>Illustration · The Road · 3</summary><p><a href="assets/8bb82354216d74.png">Open noncanonical illustration</a></p><p>The photograph left on the road with the remains of an earlier life.</p></details><details><summary>Illustration · The Road · 7</summary><p><a href="assets/f89fd60ee1daab.png">Open noncanonical illustration</a></p><p>A candlelit meal between the bunker\u2019s two cots, after washing and haircuts.</p></details></noscript>
