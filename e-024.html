      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 11</summary><h2>The flare pistol</h2><p>A hidden compartment aboard the sailboat contains an old bronze flare pistol and eight flares. The father explains it can signal and could injure someone if fired at them. He and the boy agree to fire it as a celebration. The flare briefly illuminates the bay, but would not be visible very far.</p></details><details><summary>The Road · 12</summary><h2>The flare pistol in town</h2><p>When a bowman shoots at them from an upstairs window, the father fires the flare pistol toward him. The flare enters the room and the man screams. The father later tells the boy that he did not kill the bowman.</p></details><details><summary>Illustration · The Road · 11</summary><p><a href="assets/5f045eb71b4e0c.png">Open noncanonical illustration</a></p><p>A flare rises over the bay and briefly lights the water and shore.</p></details></noscript>
