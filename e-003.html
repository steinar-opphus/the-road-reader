      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>The southward route</h2><p>The man and the boy travel south through blowing ash and camp beneath rocks.</p></details><details><summary>The Road · 1</summary><h2>The southward route</h2><p>They find edible ham and a surviving soft drink. The man later identifies a frightening ground tremor as an earthquake.</p></details><details><summary>The Road · 2</summary><h2>Across snow and a blocked bridge</h2><p>The travellers shelter beneath a tarp while fire burns on the ridges, then descend out of the snow over four days.</p></details><details><summary>The Road · 2</summary><h2>Across snow and a blocked bridge</h2><p>A jackknifed truck obstructs a bridge. The man finds human bodies inside its trailer.</p></details><details><summary>The Road · 3</summary><h2>A road marked by fire and armed travellers</h2><p>Fire softens the road’s surface enough to force a delay. Later an armed group passes with a diesel truck; after escaping, the travellers find its tracks in the ash.</p></details><details><summary>The Road · 4</summary><h2>Smoke, remains and a procession</h2><p>Smoke is visible beyond a town’s buildings. Near the earlier encounter site, the man finds bones that appear boiled.</p></details><details><summary>The Road · 4</summary><h2>Smoke, remains and a procession</h2><p>Farther on he encounters heads displayed at a wall. A red-scarved marching group includes slaves pulling wagons and collared, yoked sexual captives.</p></details><details><summary>The Road · 5</summary><h2>Snow, falling trees and concealment</h2><p>Dead cedar woods provide shelter until trees begin to fall. The travellers sleep under a fallen trunk, then encounter wheel tracks and bootprints near their camp.</p></details><details><summary>The Road · 5</summary><h2>Snow, falling trees and concealment</h2><p>They hide while two men pass, and later escape from the house through dark woods.</p></details><details><summary>The Road · 6</summary><h2>Water on the road</h2><p>After the respite at the orchard farmhouse, the travellers are reduced to drinking ditch water strained through cloth.</p></details><details><summary>The Road · 8</summary><h2>Ash winds across the coastal plain</h2><p>The travellers cross the coastal plain in ash-laden winds. The boy discovers an abandoned diesel-electric locomotive with eight stainless-steel passenger coaches.</p></details><details><summary>The Road · 9</summary><h2>Signs, dangers and a past visit</h2><p>The narration reads roadside cairns as messages to lost loved ones, and describes widespread hunger and murder. On an earlier visit to a drugstore, the travellers saw a dried human head beneath a cake cover.</p></details><details><summary>The Road · 10</summary><h2>The coast</h2><p>At the coast the travellers see a grey sea and a beach strewn with animal bones; the shore has no gulls or shorebirds.</p></details><details><summary>The Road · 11</summary><h2>A storm and the stolen camp</h2><p>A storm erases the travellers’ beach tracks and leaves an ancient corpse among driftwood. A few days after the boy recovers, bootprints appear near camp and their tarp, food, water, clothing and cart are gone.</p></details><details><summary>The Road · 12</summary><h2>The coast and the port town</h2><p>The father and boy track the thief from beach sand spilled by their cart. In a port town, they find no one at the docks. They later continue along the coast, where sand drifts across the road, until a collapsed bridge blocks their way across a broad tidal river.</p></details></noscript>
