      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 8</summary><h2>Appearance</h2><p>The old traveller is small and bent, with grey-blue eyes. He carries an army rucksack, blanket roll and peeled-stick cane; a towel is tied under his jaw, and rags and cardboard bound with green twine cover his feet.</p></details><details><summary>The Road · 8</summary><h2>Appearance and the name he offers</h2><p>He says he sees poorly and claims to be ninety. He gives the name Ely, later admits it is not his real name, and refuses to disclose his identity because he does not trust the man. His age remains a claim.</p></details><details><summary>The Road · 8</summary><h2>An uneasy meal and a parting</h2><p>The boy gives him fruit, and the father agrees to a single night’s shared camp. The traveller says he expected disaster, denies God’s existence and later retracts his claim that others have given him food.</p></details><details><summary>The Road · 8</summary><h2>An uneasy meal and a parting</h2><p>He says he never expected to see another child. At parting he receives some cans but says he would not have shared his own food with the boy.</p></details><details><summary>Illustration · The Road · 8</summary><p><a href="assets/6af5a631877e98.png">Open noncanonical illustration</a></p><p>Fruit offered to the old traveller, represented beside his pack and cane.</p></details></noscript>
