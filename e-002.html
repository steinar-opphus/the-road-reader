      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>Overview</h2><p>The boy travels south with the man, addressing him as Papa.</p></details><details><summary>The Road · 1</summary><h2>Overview</h2><p>He asks for lamplight at bedtime and insists on sharing the drink his father finds.</p></details><details><summary>The Road · 1</summary><h2>Small pleasures</h2><p>He draws fangs on his face mask. A downhill ride on the cart brings a rare smile.</p></details><details><summary>The Road · 2</summary><h2>Promises and a riverside respite</h2><p>The boy is very thin. He challenges his father to share the cocoa and repeats the warning that breaking small promises leads to breaking large ones.</p></details><details><summary>The Road · 2</summary><h2>Promises and a riverside respite</h2><p>He retrieves a yellow toy truck, describes a frightening dream about a moving wind-up penguin, and later listens to stories of courage and justice at the falls.</p></details><details><summary>The Road · 3</summary><h2>Compassion and silence</h2><p>He cries after a burned man is left behind and later says he wishes he were with his mother.</p></details><details><summary>The Road · 3</summary><h2>Compassion and silence</h2><p>After an attacker holds a knife to his throat and his father shoots the attacker, the boy does not respond to requests to speak.</p></details><details><summary>The Road · 4</summary><h2>A flute and another child</h2><p>His hair is pale and tangled. He asks whether he and his father remain good; his father assures him they do and gives him a cane flute.</p></details><details><summary>The Road · 4</summary><h2>A flute and another child</h2><p>He sees a child in an oversized coat and offers to give that child half his food, despite his father’s denial that another boy is present.</p></details><details><summary>The Road · 5</summary><h2>Warnings at the house</h2><p>He helps gather wood in the snow; his cheeks are sunken and black-streaked. He asks his father not to approach the house.</p></details><details><summary>The Road · 5</summary><h2>Warnings at the house</h2><p>When the travellers hide after their flight, his father promises that he cannot leave him.</p></details><details><summary>The Road · 6</summary><h2>Watchfulness and refusal</h2><p>He keeps watch while his father rests. During renewed starvation his skin is described as candle-coloured and almost translucent.</p></details><details><summary>The Road · 6</summary><h2>Watchfulness and refusal</h2><p>He asks about the expected fate of the cellar captives and seeks a promise that they will never eat people. He still wishes the other boy were with them and begs his father not to open another hidden hatch.</p></details><details><summary>The Road · 7</summary><h2>Gratitude and renewed clothing</h2><p>He thanks the absent owners of the bunker, but will not remain below by himself. With his father, he wears new sweaters and socks and plays checkers.</p></details><details><summary>The Road · 7</summary><h2>Gratitude and renewed clothing</h2><p>His father cuts his golden hair and assigns him the role of lookout rather than allowing him to push a second cart.</p></details><details><summary>The Road · 8</summary><h2>Sharing with the old traveller</h2><p>He sweeps branches ahead of the cart and says he threw away his flute. He asks his father about their long-term goals.</p></details><details><summary>The Road · 8</summary><h2>Sharing with the old traveller</h2><p>He gives the old traveller a tin of fruit cocktail and later objects to his father mocking him.</p></details><details><summary>The Road · 9</summary><h2>Watchfulness and compassion</h2><p>He believes someone may be following and proposes hiding their rubbish and waiting unseen to count the pursuers.</p></details><details><summary>The Road · 9</summary><h2>Watchfulness and compassion</h2><p>After finding the remains of a human infant at a campsite, he says the baby could have gone with them. He later apologizes for what he had said about other dead people.</p></details><details><summary>The Road · 10</summary><h2>At the house and the surf</h2><p>The boy worries that someone may be upstairs and reminds his father that wind erases tracks in ash. Later, he swims in the cold surf and cries when he returns, without explaining why.</p></details><details><summary>The Road · 11</summary><h2>Illness and loss</h2><p>The boy becomes feverish, vomits and asks his father not to leave. After being nursed through the illness, he wakes feeling better and remembers the flare being fired. Later, he begins to cry when they discover their camp has been robbed.</p></details><details><summary>The Road · 12</summary><h2>Mercy and farewell</h2><p>The boy pleads with his father not to kill the thief, then asks him to go back and help. Later he says that stories about helping others ring false because they do not help people. As his father nears death, the boy says goodbye and promises to keep talking to him.</p></details><details><summary>Illustration · The Road · 1</summary><p><a href="assets/aaf4195476f2a6.png">Open noncanonical illustration</a></p><p>Lamplight beneath the rock shelter at bedtime.</p></details><details><summary>Illustration · The Road · 2</summary><p><a href="assets/2414a88a163d2c.png">Open noncanonical illustration</a></p><p>A pause on the gravel below the waterfall.</p></details><details><summary>Illustration · The Road · 4</summary><p><a href="assets/d379c78d17d06d.png">Open noncanonical illustration</a></p><p>Concentration on a tune played with the handmade cane flute.</p></details><details><summary>Illustration · The Road · 8</summary><p><a href="assets/6af5a631877e98.png">Open noncanonical illustration</a></p><p>Fruit offered to the old traveller, represented beside his pack and cane.</p></details></noscript>
