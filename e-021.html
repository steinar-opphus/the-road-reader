      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 10</summary><h2>The sailboat Pájaro de Esperanza</h2><p>The travellers see a partly submerged sailboat, about sixty feet long, off the coast. Its masts are broken and much of its deck hardware has been swept away. The father swims to it and reads the name Pájaro de Esperanza and the marking Tenerife.</p></details><details><summary>The Road · 10</summary><h2>The sailboat Pájaro de Esperanza</h2><p>The boat has been ransacked by the sea and its cabin is wet. The father searches it for supplies, tools and the ship’s log. As the tide comes in, he sees the hull lift and slide slightly.</p></details><details><summary>The Road · 11</summary><h2>Salvage from the sailboat</h2><p>The father brings ashore water, canned food, fuel and a stove burner. A storm shifts the boat while they are on the beach. In a hidden compartment he finds a raft, signalling equipment, a first-aid kit and a flare pistol.</p></details><details><summary>Illustration · The Road · 10</summary><p><a href="assets/6b160b63c7cfd0.png">Open noncanonical illustration</a></p><p>A partly submerged sailboat lies low in the grey water, its masts broken close to the deck.</p></details></noscript>
