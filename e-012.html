      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 5</summary><h2>A grand facade</h2><p>The house has white Doric columns and a foyer floored with black-and-white marble. A large heap of clothing and bedding lies inside; a cord leads through a window to a brass bell.</p></details><details><summary>The Road · 5</summary><h2>A grand facade</h2><p>A locked floor hatch conceals a cellar. In the yard is a cast-iron cauldron standing over ashes.</p></details><details><summary>The Road · 5</summary><h2>The cellar and the flight</h2><p>The man forces the hatch. Below it are naked captives, one missing both legs to the hip; they plead for help.</p></details><details><summary>The Road · 5</summary><h2>The cellar and the flight</h2><p>Four bearded men and two women approach as the travellers flee. That night the man hears screams and interprets a roadside box as a lookout connected to the bell; that interpretation remains attributed to him.</p></details><details><summary>Illustration · The Road · 5</summary><p><a href="assets/b95fed1a5301a0.png">Open noncanonical illustration</a></p><p>The columned house and the cord running from its window.</p></details></noscript>
