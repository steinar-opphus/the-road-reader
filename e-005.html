      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>Remnants and memories</h2><p>The man explains how a dam once generated electricity. The narration recalls roads full of refugees in the first years.</p></details><details><summary>The Road · 2</summary><h2>The vanished states</h2><p>The man tells the boy that the states no longer exist.</p></details><details><summary>The Road · 3</summary><h2>The first moments of disaster</h2><p>The recollection begins with clocks stopping at 1:17, a long light and low concussions. It gives no cause for these events.</p></details><details><summary>The Road · 6</summary><h2>An unanswered question about surviving animals</h2><p>The man wonders whether a cow might still be alive somewhere. His uncertainty does not establish either survival or extinction.</p></details><details><summary>The Road · 9</summary><h2>A remembered act of cruelty</h2><p>A remembered scene describes men burning snakes they had dug from a hillside grotto. It is presented as the narrator’s memory, not a current event.</p></details></noscript>
