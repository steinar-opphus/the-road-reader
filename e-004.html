      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>A mobile store of essentials</h2><p>The travellers push a cart fitted with a chrome motorcycle mirror to watch behind. Essential supplies also travel in knapsacks in case the cart must be abandoned.</p></details><details><summary>The Road · 1</summary><h2>A mobile store of essentials</h2><p>The man repairs a wheel with a pipe sleeve, recovers oil for their lamp and finds two woollen blankets.</p></details><details><summary>The Road · 2</summary><h2>Map leaves and a narrow passage</h2><p>Their torn oil-company map is arranged using crayon numbers. At a blocked bridge, they unload the cart to pass their belongings beneath the truck.</p></details><details><summary>The Road · 4</summary><h2>Recovered equipment and dwindling meals</h2><p>The man recovers the plundered cart, but the boy’s knapsack is gone. Their last tin of food is eaten.</p></details><details><summary>The Road · 4</summary><h2>Recovered equipment and dwindling meals</h2><p>They make cakes from sifted cornmeal, later finish a handful of raisins, and find unidentified grain in a barn.</p></details><details><summary>The Road · 5</summary><h2>Leaving the cart behind</h2><p>The man makes foot wraps from a coat and plastic, packs essential belongings into a knapsack, and leaves the cart behind. He later loses the lighter in the cellar.</p></details><details><summary>The Road · 7</summary><h2>A replacement from the market</h2><p>The man selects another grocery cart from an abandoned market. This replaces the cart left behind in the snow; it is not the original vehicle.</p></details><details><summary>The Road · 8</summary><h2>A loaded cart without the old mirror</h2><p>The replacement cart is loaded for departure. The man regrets not salvaging the original cart’s motorcycle mirror.</p></details><details><summary>The Road · 10</summary><h2>The cart carries their supplies</h2><p>After leaving the house, they push a repaired wheelbarrow loaded with blankets and canned goods. In town they retrieve gasoline from an underground tank for the cart.</p></details><details><summary>The Road · 12</summary><h2>The abandoned cart</h2><p>When windfall trees and wreckage block the road, the travellers pack their remaining goods into bags and leave the cart behind.</p></details><details><summary>Illustration · The Road · 1</summary><p><a href="assets/16f72664173853.png">Open noncanonical illustration</a></p><p>A cart equipped for watching the road behind.</p></details></noscript>
