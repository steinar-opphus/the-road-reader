      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 6</summary><h2>A protected door beneath the grass</h2><p>At this house the man finds old gasoline and motor oil. He uncovers a buried plywood door with roofing felt and a padlock protected by a plastic bag.</p></details><details><summary>The Road · 6</summary><h2>A protected door beneath the grass</h2><p>The boy begs him not to open it.</p></details><details><summary>The Road · 7</summary><h2>Food, beds and light below the hatch</h2><p>The door opens onto a concrete-block bunker with two iron cots, canned food and hundreds of gallons of water. The travellers eat fruit and sleep through a night and the next day.</p></details><details><summary>The Road · 7</summary><h2>Food, beds and light below the hatch</h2><p>The man hides the hatch beneath a mattress. They share a plentiful candlelit meal; during heavy rain, some water leaks down the stairs.</p></details><details><summary>Illustration · The Road · 7</summary><p><a href="assets/f89fd60ee1daab.png">Open noncanonical illustration</a></p><p>A candlelit meal between the bunker\u2019s two cots, after washing and haircuts.</p></details></noscript>
