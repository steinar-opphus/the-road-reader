      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Road · 1</summary><h2>Light and essential supplies</h2><p>The travellers carry essential belongings in knapsacks in case the cart must be abandoned. The man recovers motor oil for their small lamp.</p></details><details><summary>The Road · 6</summary><h2>Replacement tools and light</h2><p>The man acquires a box cutter and screwdriver, improvises ignition after losing the lighter, and later makes a lamp from a beer bottle and cloth wick.</p></details><details><summary>The Road · 7</summary><h2>Lighting and equipment for departure</h2><p>The replacement bottle lamp is lit. In the bunker, the man restores an electric lantern, then finds lighters and lights a fuel lamp.</p></details><details><summary>The Road · 7</summary><h2>Lighting and equipment for departure</h2><p>He finds ammunition without a gun and makes wooden dummy bullets so the revolver appears loaded. He also reduces the stove to a smaller travelling burner.</p></details><details><summary>The Road · 8</summary><h2>A lost reserve of fuel</h2><p>The travellers wear new masks cut from sheeting. Their stove’s tank runs empty after a few days; later, their search of an abandoned train yields paper plates.</p></details></noscript>
